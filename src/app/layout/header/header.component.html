<header class="topbar">
  <button class="hamburger" type="button" aria-label="Toggle sidebar" (click)="onToggle()">
    <span></span><span></span><span></span>
  </button>
  <div class="bank-select" role="img" [attr.aria-label]="bank.name + ', ' + bank.tagline">
    <app-icon name="bank-logo"/>
    <span class="b-txt"><b>{{ bank.name }}</b><i>{{ bank.tagline }}</i></span>
    <app-icon name="chevron" aria-hidden="true"/>
  </div>
</header>
