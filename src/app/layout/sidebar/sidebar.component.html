<aside class="sidebar" [attr.inert]="sidebarCollapsed() ? '' : null" [attr.aria-hidden]="sidebarCollapsed()">
  <div class="logo-row">
    <img class="logo-img" src="/assets/connexis_logo-light-removebg-preview.png" alt="Connexis">
  </div>

  <nav class="nav">
    <a class="nav-item"
       *ngFor="let item of navItems()"
       [routerLink]="item.route"
       routerLinkActive="active"
       [routerLinkActiveOptions]="linkOptions(item.route)"
       (click)="onNavClick()">
      <app-icon [name]="item.symbol" aria-hidden="true" />{{ item.label }}
    </a>
  </nav>

  <div class="side-bottom">
    <h3>{{ sidebar.lines[0] }}<br>{{ sidebar.lines[1] }}</h3>
    <div class="stores">
      <a class="store-badge"
         *ngFor="let badge of storeBadges"
         [href]="badge.href"
         target="_blank"
         rel="noopener noreferrer"
         [attr.aria-label]="badge.line1 + ' ' + badge.line2">
        <img class="store-logo" [src]="badge.img" alt="">
        <span><small>{{ badge.line1 }}</small><b>{{ badge.line2 }}</b></span>
      </a>
    </div>
    <div class="scan-label">{{ sidebar.scanLabel }}</div>
    <img class="qr-img" src="/assets/connexis-qr.png" alt="QR code">
  </div>
</aside>
